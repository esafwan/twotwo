<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI in Dubai Retail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1b2a;--ink:#f6f1e7;--muted:#b9c2cc;--accent:#ffb627;--line:rgba(246,241,231,.18)}
*{box-sizing:border-box;margin:0}
html,body{background:#060d15;min-height:100%}
body{font-family:Archivo,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px 16px}
.poster{position:relative;overflow:hidden;width:100%;max-width:560px;aspect-ratio:4/5;min-height:600px;background:var(--bg);border-radius:6px;padding:clamp(24px,6vw,44px);display:flex;flex-direction:column}
.poster::before{content:"";position:absolute;right:-30%;top:-18%;width:85%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,182,39,.28),rgba(255,182,39,0) 68%);pointer-events:none}
.tag{position:relative;align-self:flex-start;font-weight:900;font-size:clamp(15px,4.2vw,18px);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:2px solid var(--accent);border-radius:6px;padding:7px 14px}
.bars{position:absolute;right:clamp(24px,6vw,44px);top:clamp(80px,18%,120px);display:flex;gap:6px;align-items:flex-end;height:30%;opacity:.9}
.bars i{display:block;width:clamp(10px,3vw,16px);border-radius:3px;background:linear-gradient(var(--accent),rgba(255,182,39,.15))}
.sub b{color:var(--ink);font-weight:700}
h1{position:relative;margin-top:auto;font-weight:900;font-size:clamp(46px,14vw,82px);line-height:.92;letter-spacing:-.03em}
h1 span{color:var(--accent)}
.sub{position:relative;margin-top:16px;font-size:clamp(16px,4.4vw,20px);line-height:1.35;color:var(--muted);max-width:26ch}
.meta{position:relative;margin-top:auto;padding-top:28px;display:grid;gap:4px;border-top:1px solid var(--line);margin-bottom:22px}
.meta .when{font-weight:700;font-size:clamp(20px,5.6vw,26px)}
.meta .where{font-size:clamp(16px,4.4vw,19px);color:var(--muted)}
.cta{position:relative;display:block;text-align:center;text-decoration:none;background:var(--accent);color:#0d1b2a;font-weight:900;font-size:clamp(19px,5.4vw,24px);padding:18px 20px;border-radius:12px}
</style></head><body>
<main class="poster">
  <p class="tag">20 seats only</p>
  <div class="bars" aria-hidden="true"><i style="height:28%"></i><i style="height:45%"></i><i style="height:38%"></i><i style="height:62%"></i><i style="height:80%"></i><i style="height:100%"></i></div>
  <h1>AI in<br><span>Dubai</span><br>Retail</h1>
  <p class="sub"><b>For retail owners:</b> practical AI for everyday store operations.</p>
  <div class="meta"><p class="when">Friday · 4:30–7:30 PM</p><p class="where">AWS AI Campus</p></div>
  <a class="cta" href="#reserve">Reserve your seat →</a>
</main>
</body></html>
