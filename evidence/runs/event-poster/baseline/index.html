<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI in Dubai Retail</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--ink:#f5f2ea;--muted:#a9b0c4;--accent:#ffb238;--accent2:#2fd3c0}
*{box-sizing:border-box;margin:0}
body{background:#05070f;font-family:Inter,system-ui,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
.poster{width:100%;max-width:520px;aspect-ratio:4/5.4;min-height:600px;background:radial-gradient(circle at 85% 10%,rgba(47,211,192,.35),transparent 45%),radial-gradient(circle at 0% 100%,rgba(255,178,56,.3),transparent 50%),var(--bg);border-radius:20px;padding:clamp(24px,7vw,44px);display:flex;flex-direction:column;position:relative;overflow:hidden}
.tag{display:inline-block;align-self:flex-start;background:var(--accent);color:#1a1200;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:999px}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(3rem,15vw,5.2rem);line-height:.92;letter-spacing:-.03em;margin-top:28px}
h1 em{font-style:normal;color:var(--accent2)}
.sub{font-size:clamp(1.05rem,4.4vw,1.3rem);color:var(--muted);margin-top:18px;max-width:22ch;line-height:1.35}
.meta{margin-top:auto;display:grid;gap:10px;font-size:clamp(1rem,4.2vw,1.2rem);font-weight:600;padding-top:28px}
.meta div{display:flex;gap:12px;align-items:center}
.meta span{width:8px;height:8px;border-radius:50%;background:var(--accent2);flex:none}
.cta{margin-top:24px;display:block;text-align:center;background:var(--accent);color:#1a1200;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(1.2rem,5.5vw,1.5rem);padding:18px;border-radius:14px;text-decoration:none}
</style></head><body>
<main class="poster">
<span class="tag">20 seats only</span>
<h1>AI in <em>Dubai</em> Retail</h1>
<p class="sub">Practical AI for everyday store operations.</p>
<div class="meta">
<div><span></span>Friday · 4:30–7:30 PM</div>
<div><span></span>AWS AI Campus</div>
<div><span></span>For retail owners</div>
</div>
<a class="cta" href="#reserve">Reserve your seat →</a>
</main>
</body></html>
