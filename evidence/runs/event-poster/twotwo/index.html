<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI in Dubai Retail</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1b2a;--ink:#f5f1e8;--muted:#a9b4c2;--acc:#ffb703;--acc-ink:#0d1b2a}
*{box-sizing:border-box;margin:0}
html,body{background:#06101a}
body{font-family:Archivo,system-ui,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
.poster{width:100%;max-width:560px;aspect-ratio:4/5;min-height:min-content;background:var(--bg);border-radius:6px;padding:clamp(24px,7vw,48px);display:flex;flex-direction:column;position:relative;overflow:hidden}
.poster::before{content:"";position:absolute;right:-18%;top:-12%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#1f4e79 0%,transparent 70%);opacity:.9}
.poster>*{position:relative}
.kicker{font-weight:800;font-size:clamp(13px,3.4vw,16px);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{font-weight:900;font-size:clamp(46px,14vw,84px);line-height:.92;letter-spacing:-.02em;margin-top:16px}
h1 span{color:var(--acc)}
.sub{font-weight:500;font-size:clamp(17px,4.6vw,22px);line-height:1.3;color:var(--muted);margin-top:18px;max-width:22ch}
.facts{margin-top:auto;padding-top:32px;display:grid;gap:6px;font-weight:800;font-size:clamp(19px,5.2vw,26px)}
.facts .place{color:var(--muted);font-weight:500}
.seats{margin-top:28px;font-weight:800;font-size:clamp(14px,3.8vw,17px);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.cta{margin-top:8px;font-weight:900;font-size:clamp(28px,8.2vw,46px);white-space:nowrap;line-height:1;letter-spacing:-.01em;border-top:4px solid var(--acc);padding-top:14px}
@media (max-width:600px){body{padding:0;place-items:stretch}.poster{max-width:none;aspect-ratio:auto;min-height:100vh;border-radius:0}}
</style></head><body>
<main class="poster">
<p class="kicker">For retail owners</p>
<h1>AI in Dubai <span>Retail</span></h1>
<p class="sub">Practical AI for everyday store operations.</p>
<div class="facts"><p>Friday · 4:30–7:30 PM</p><p class="place">AWS AI Campus</p></div>
<p class="seats">20 seats only</p>
<p class="cta">Reserve your seat</p>
</main>
</body></html>
